[project]
name = "svc-c2-050"
version = "0.1.0"
description = "MICEEventPlanningChecklistVendorBriefGenerationAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry in CI. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
#
# langchain-anthropic IS a real, direct dependency (not a framework extra):
# shared.services.llm.anthropic_client.AnthropicClient imports it directly.
# CI's run-tests only ever runs `-e ".[dev]"` — an
# [project.optional-dependencies] group other than "anthropic" is NEVER
# installed in CI at all, only by a developer manually opting in locally.
# AnthropicClient is constructed for real by
# tests/proof_of_boundary/test_server_llm_injection.py (a mandatory
# scaffold test), so this package must be a plain dependency, not an
# optional group — it was previously declared as an "anthropic" optional
# group, which meant that test failed on the real CI pipeline every time.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    # Pinned to match agenticstar-agentcore's own pyyaml==6.0.1 requirement —
    # a different pin here creates an unresolved dependency conflict.
    "PyYAML==6.0.1",
    "langchain-anthropic==1.4.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
# 68.2.2, not the scaffold default 68.0.0 — known scaffold-drift note
# (per-project fix; do not edit the scaffold source itself).
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml"]
ignore_missing_imports = true
